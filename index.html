<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<title>V Build Accounting</title>
<style>
:root{--bg:#f5f6f8;--card:#fff;--text:#111827;--muted:#6b7280;--line:#e5e7eb;--dark:#111827;--green:#15803d;--red:#b91c1c}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif}
main{max-width:760px;margin:auto;padding:18px 14px 42px}.brand{display:flex;align-items:center;gap:11px;margin:4px 2px 18px}.logo{width:45px;height:45px;border-radius:12px;background:#111827;color:#fff;display:grid;place-items:center;font-weight:800}.brand h1{font-size:20px;margin:0}.brand p{font-size:12px;color:var(--muted);margin:2px 0 0}
.summary{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}.label{font-size:12px;color:var(--muted)}.value{font-size:20px;font-weight:750;margin-top:4px}.income{color:var(--green)}.expense{color:var(--red)}
section{margin-top:14px}.section-title{font-weight:700;margin:0 0 12px}.form{display:grid;grid-template-columns:1fr 1fr;gap:11px}label{font-size:12px;color:var(--muted)}input,select{width:100%;margin-top:5px;border:1px solid var(--line);border-radius:11px;background:#fff;padding:12px;font:inherit;color:var(--text);min-height:46px}.full{grid-column:1/-1}
button{border:0;border-radius:11px;min-height:46px;padding:11px 15px;font-weight:700;font:inherit;cursor:pointer}.primary{background:var(--dark);color:#fff}.secondary{background:#fff;border:1px solid var(--line)}
.actions{display:flex;gap:8px;flex-wrap:wrap}.entry{display:grid;grid-template-columns:1fr auto;gap:8px;padding:12px 0;border-top:1px solid var(--line)}.entry:first-child{border-top:0}.entry-main{min-width:0}.entry-title{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.entry-meta{font-size:12px;color:var(--muted);margin-top:3px}.amount{font-weight:750;text-align:right}.del{font-size:12px;color:var(--red);background:transparent;padding:4px;min-height:auto}.empty{text-align:center;color:var(--muted);padding:22px 5px;font-size:14px}.note{font-size:12px;color:var(--muted);margin-top:10px;line-height:1.5}
@media(max-width:520px){.form{grid-template-columns:1fr}.full{grid-column:auto}.value{font-size:18px}}
</style>
</head>
<body>
<main>
<div class="brand"><div class="logo">VB</div><div><h1>V Build Accounting</h1><p>Design & Renovation · Project Accounts</p></div></div>
<div class="summary">
 <div class="card"><div class="label">總收入</div><div class="value income" id="income">RM 0.00</div></div>
 <div class="card"><div class="label">總支出</div><div class="value expense" id="expense">RM 0.00</div></div>
 <div class="card"><div class="label">目前結餘</div><div class="value" id="balance">RM 0.00</div></div>
 <div class="card"><div class="label">記錄筆數</div><div class="value" id="count">0</div></div>
</div>

<section class="card">
<h2 class="section-title">新增記帳</h2>
<form id="form" class="form">
<label>日期<input id="date" type="date" required></label>
<label>類型<select id="type"><option value="income">收入</option><option value="expense">支出</option></select></label>
<label>Project / 客戶<input id="project" placeholder="例如：Shu Wen"></label>
<label>分類<select id="category"><option>Client Payment</option><option>Material</option><option>Worker / Labour</option><option>Sub-contractor</option><option>Transport</option><option>Office</option><option>Submission</option><option>Other</option></select></label>
<label>金額（RM）<input id="amount" type="number" min="0.01" step="0.01" inputmode="decimal" required placeholder="0.00"></label>
<label>付款方式<select id="method"><option>Bank Transfer</option><option>Cash</option><option>Cheque</option><option>Credit Card</option><option>Other</option></select></label>
<label class="full">備註<input id="note" placeholder="例如：Tiles deposit / Progress payment"></label>
<div class="full actions"><button class="primary" type="submit">＋ 加入記錄</button><button class="secondary" id="exportBtn" type="button">匯出 CSV</button></div>
</form>
<div class="note">資料會保存在這台裝置的瀏覽器內。正式多人／多手機同步版可再接雲端資料庫。</div>
</section>

<section class="card">
<div style="display:flex;justify-content:space-between;gap:10px;align-items:center"><h2 class="section-title" style="margin:0">最近記錄</h2><select id="filter" style="width:auto;margin:0"><option value="all">全部</option><option value="income">收入</option><option value="expense">支出</option></select></div>
<div id="list" style="margin-top:10px"></div>
</section>
</main>
<script>
const KEY='vbuild-accounting-v1';
let entries=[];
try{entries=JSON.parse(localStorage.getItem(KEY)||'[]');if(!Array.isArray(entries))entries=[]}catch(e){entries=[]}
const $=id=>document.getElementById(id);
const now=new Date(); $('date').value=[now.getFullYear(),String(now.getMonth()+1).padStart(2,'0'),String(now.getDate()).padStart(2,'0')].join('-');
const money=n=>'RM '+Number(n||0).toLocaleString('en-MY',{minimumFractionDigits:2,maximumFractionDigits:2});
function save(){localStorage.setItem(KEY,JSON.stringify(entries))}
function render(){
 const inc=entries.filter(x=>x.type==='income').reduce((s,x)=>s+x.amount,0);
 const exp=entries.filter(x=>x.type==='expense').reduce((s,x)=>s+x.amount,0);
 $('income').textContent=money(inc);$('expense').textContent=money(exp);$('balance').textContent=money(inc-exp);$('count').textContent=entries.length;
 const f=$('filter').value, list=entries.filter(x=>f==='all'||x.type===f).slice().reverse(); $('list').innerHTML='';
 if(!list.length){$('list').innerHTML='<div class="empty">還沒有記錄。</div>';return}
 list.forEach(x=>{const row=document.createElement('div');row.className='entry';
  const left=document.createElement('div');left.className='entry-main';
  const title=document.createElement('div');title.className='entry-title';title.textContent=x.project||x.category;
  const meta=document.createElement('div');meta.className='entry-meta';meta.textContent=[x.date,x.category,x.method,x.note].filter(Boolean).join(' · ');
  left.append(title,meta);
  const right=document.createElement('div');const amt=document.createElement('div');amt.className='amount '+(x.type==='income'?'income':'expense');amt.textContent=(x.type==='income'?'+ ':'− ')+money(x.amount);
  const del=document.createElement('button');del.type='button';del.className='del';del.textContent='刪除';del.onclick=()=>{if(confirm('刪除這筆記錄？')){entries=entries.filter(e=>e.id!==x.id);save();render()}};
  right.append(amt,del);row.append(left,right);$('list').append(row);
 });
}
$('form').addEventListener('submit',e=>{e.preventDefault();const amount=Number($('amount').value);if(!Number.isFinite(amount)||amount<=0)return;
 entries.push({id:crypto.randomUUID?crypto.randomUUID():String(Date.now()),date:$('date').value,type:$('type').value,project:$('project').value.trim(),category:$('category').value,amount,method:$('method').value,note:$('note').value.trim()});save();$('amount').value='';$('note').value='';render();
});
$('filter').addEventListener('change',render);
$('exportBtn').addEventListener('click',()=>{const q=v=>'\"'+String(v??'').replaceAll('\"','\"\"')+'\"';const rows=[['Date','Type','Project','Category','Amount RM','Method','Note'],...entries.map(x=>[x.date,x.type,x.project,x.category,x.amount.toFixed(2),x.method,x.note])];const csv='\ufeff'+rows.map(r=>r.map(q).join(',')).join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='V-Build-Accounting.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)});
render();
if('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script>
</body></html>
